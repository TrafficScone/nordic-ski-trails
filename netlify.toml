# Static site. Netlify serves public/ as-is; the only "build" is regenerating
# public/trails/index.json so a dropped-in CalTopo export can't be missed.
# Only public/ is deployed, so tools/ and the docs stay off the website.
[build]
  publish = "public"
  # Swap the MapTiler key (Netlify env var MAPTILER_KEY) into the placeholder
  # in js/config.js; fail the build if it isn't set. Then index the trails.
  command = "sed -i \"s/__MAPTILER_KEY__/${MAPTILER_KEY:?Set MAPTILER_KEY in Netlify environment variables}/\" public/js/config.js && python3 tools/index_trails.py"

# The MapTiler key has to reach browsers (tiles can't load without it), so it
# legitimately appears in the built js/config.js. Tell Netlify's secrets scanner
# that's expected rather than a leak.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "MAPTILER_KEY"

# Trail data should never be served stale after a deploy.
[[headers]]
  for = "/trails/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must always be re-fetched so updates roll out.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
