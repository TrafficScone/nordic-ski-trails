<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BNC | Places to Ski</title>
<meta name="description" content="A map of nordic ski trails." />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0c3d54" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/bnc-mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<main id="map"></main>

<div id="offline-note" class="offline-note" role="status">Offline — showing saved maps and trails</div>

<aside id="panel">
  <button id="btn-list" class="panel-head" title="Show or hide the trail list">
    <span class="brand">🎿 Nordic Ski Trails</span>
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  <div id="filters" class="panel-filters"></div>
  <div id="list" class="list"></div>
</aside>

<!-- Map key: moved into a bottom-right map control by app.js. -->
<section id="key" class="key" aria-label="Map key">
  <div class="key-head">
    <h2>Map key</h2>
    <button id="key-hide" class="key-hide" type="button" title="Hide the map key">Hide</button>
  </div>
  <div id="legend"></div>
  <label class="toggle"><input id="slope-toggle" type="checkbox" /> Slope angle shading</label>
  <div id="slope-legend" class="legend" hidden></div>
  <div id="coords" class="coords" hidden></div>
</section>
<button id="key-show" class="key-show" type="button" hidden>Map key</button>

<!-- Club card: moved into a bottom-left map control by app.js. -->
<aside id="club" class="club" aria-label="Boulder Nordic Club">
  <img class="club-logo" src="icons/bnc-mark.png" alt="" width="40" height="40" />
  <div class="club-text">
    <p class="club-pitch">Support nordic skiing in the Front Range</p>
    <a class="club-join" href="https://bouldernordic.org/membership-account/membership-levels/" target="_blank" rel="noopener">Join the Boulder Nordic Club</a>
    <p class="club-feedback">Feedback? <a href="mailto:info@bouldernordic.org">info@bouldernordic.org</a></p>
  </div>
</aside>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
