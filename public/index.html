<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nordic Ski Trails</title>
<meta name="description" content="A map of nordic ski trails." />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0c3d54" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎿</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<main id="map"></main>

<div id="offline-note" class="offline-note" role="status">Offline — showing saved maps and trails</div>

<aside id="panel">
  <button id="btn-list" class="panel-head" title="Show or hide the trail list">
    <span class="brand">🎿 Nordic Ski Trails</span>
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  <div id="filters" class="panel-filters"></div>
  <div id="list" class="list"></div>
  <div class="panel-foot">
    <details class="key">
      <summary>Map key</summary>
      <div id="legend"></div>
    </details>
    <label class="toggle"><input id="slope-toggle" type="checkbox" /> Slope angle shading</label>
    <div id="slope-legend" class="legend" hidden></div>
  </div>
</aside>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
