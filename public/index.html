<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nordic Ski Trails</title>
<meta name="description" content="Map, draw, and document nordic ski trails." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎿</text></svg>" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="brand"><span class="brand-mark">🎿</span><span class="brand-name">Nordic Ski Trails</span></div>

    <div class="toolgroup" role="group" aria-label="Drawing tools">
      <button id="tool-pan"   class="tool is-active" data-mode="idle"  title="Pan / select (Esc)"><span class="ico">✥</span><span class="lbl">Select</span></button>
      <button id="tool-line"  class="tool" data-mode="line"  title="Draw a trail (L)"><span class="ico">〜</span><span class="lbl">Trail</span></button>
      <button id="tool-point" class="tool" data-mode="point" title="Drop a place (P)"><span class="ico">◉</span><span class="lbl">Place</span></button>
    </div>

    <div class="spacer"></div>

    <div class="toolgroup" role="group" aria-label="Map options">
      <button id="btn-undo" class="tool" title="Undo (Ctrl+Z)" disabled><span class="ico">↶</span></button>
      <button id="btn-terrain" class="tool" title="Toggle 3D terrain"><span class="ico">⛰</span></button>
      <button id="btn-units" class="tool" title="Toggle units"><span class="lbl" id="units-label">mi</span></button>
    </div>

    <div class="toolgroup" role="group" aria-label="Data">
      <button id="btn-import" class="tool" title="Import GeoJSON / GPX"><span class="ico">⤒</span><span class="lbl">Import</span></button>
      <button id="btn-export" class="tool" title="Export GeoJSON"><span class="ico">⤓</span><span class="lbl">Export</span></button>
      <input id="file-input" type="file" accept=".geojson,.json,.gpx,application/geo+json,application/json" hidden />
    </div>
  </header>

  <aside id="sidebar">
    <div class="side-head">
      <input id="search" type="search" placeholder="Search trails &amp; places…" autocomplete="off" />
      <button id="btn-collapse" class="icon-btn" title="Hide list">‹</button>
    </div>

    <div id="stats" class="stats"></div>

    <div class="filters" id="filters"></div>

    <div id="list" class="list"></div>

    <div class="side-foot">
      <button id="btn-reload" class="link-btn" title="Discard local edits and reload data/trails.geojson">Reset to published data</button>
      <span id="save-state" class="save-state">saved</span>
    </div>
  </aside>

  <button id="btn-expand" class="icon-btn floating" title="Show list" hidden>›</button>

  <main id="map"></main>

  <aside id="details" hidden>
    <div class="det-head">
      <h2 id="det-title">Details</h2>
      <button id="det-close" class="icon-btn" title="Close">✕</button>
    </div>
    <div id="det-body" class="det-body"></div>
    <div class="det-foot">
      <button id="det-editgeom" class="btn">Edit shape</button>
      <button id="det-delete" class="btn btn-danger">Delete</button>
    </div>
  </aside>

  <div id="hint" class="hint" hidden></div>
  <div id="toast" class="toast" hidden></div>

</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
